<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفعاليات الجامعية - تسجيل الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .student-form, .event-card, .my-events {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000010;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .event-card h3 {
            color: #0369a1;
        }

        .message {
            margin: 15px 0;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

<header>
    <h1>منصة الفعاليات الجامعية</h1>
    <p>اكتشف الفعاليات الجامعية وسجل بسهولة</p>
</header>

<div class="container">

    <section class="student-form">
        <h2>بيانات الطالب</h2>

        <label>اسم الطالب</label>
        <input type="text" id="studentName" placeholder="أدخل اسمك">

        <label>البريد الإلكتروني</label>
        <input type="email" id="studentEmail" placeholder="أدخل بريدك الجامعي">

        <p id="message" class="message"></p>
    </section>

    <h2>الفعاليات المتاحة</h2>
    <div class="events-grid" id="eventsList"></div>

    <section class="my-events">
        <h2>فعالياتي المسجل بها</h2>
        <div id="myEvents">
            لم تسجل بأي فعالية بعد.
        </div>
    </section>

</div>

<script>
    const events = [
        {
            id: 1,
            name: "يوم التكنولوجيا",
            date: "2026-11-15",
            location: "قاعة الجامعة",
            description: "فعالية للتعرف على أحدث التقنيات."
        },
        {
            id: 2,
            name: "ورشة الذكاء الاصطناعي",
            date: "2026-11-20",
            location: "مختبر الحاسوب",
            description: "ورشة تعريفية بتطبيقات الذكاء الاصطناعي."
        },
        {
            id: 3,
            name: "اليوم الرياضي",
            date: "2026-11-25",
            location: "الملعب الجامعي",
            description: "يوم رياضي للطلاب."
        }
    ];

    let registrations = JSON.parse(
        localStorage.getItem("registrations")
    ) || [];

    function displayEvents() {
        const eventsList = document.getElementById("eventsList");

        eventsList.innerHTML = events.map(event => 
            <div class="event-card">
                <h3>${event.name}</h3>
                <p>التاريخ: ${event.date}</p>
                <p>المكان: ${event.location}</p>
                <p>${event.description}</p>
                <button onclick="register(${event.id})">
                    سجل الآن
                </button>
            </div>
        ).join("");
    }
  function register(eventId) {
        const name = document.getElementById("studentName").value.trim();
        const email = document.getElementById("studentEmail").value.trim();
        const message = document.getElementById("message");

        if (!name || !email) {
            showMessage("يرجى إدخال الاسم والبريد الإلكتروني.", "error");
            return;
        }

        const event = events.find(item => item.id === eventId);

        const alreadyRegistered = registrations.some(registration =>
            registration.email.toLowerCase() === email.toLowerCase() &&
            registration.eventId === eventId
        );

        if (alreadyRegistered) {
            showMessage("أنت مسجل مسبقاً بهذه الفعالية.", "error");
            return;
        }

        registrations.push({
            name: name,
            email: email,
            eventId: eventId,
            eventName: event.name
        });

        localStorage.setItem(
            "registrations",
            JSON.stringify(registrations)
        );

        showMessage("تم تسجيلك بنجاح في " + event.name, "success");

        displayMyEvents();
    }

    function displayMyEvents() {
        const email = document.getElementById("studentEmail").value.trim();

        const myEvents = registrations.filter(registration =>
            registration.email.toLowerCase() === email.toLowerCase()
        );

        const container = document.getElementById("myEvents");

        if (myEvents.length === 0) {
            container.innerHTML = "لم تسجل بأي فعالية بعد.";
            return;
        }

        container.innerHTML = myEvents.map(registration => 
            <p>✓ ${registration.eventName}</p>
        ).join("");
    }

    function showMessage(text, type) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = "message " + type;
    }

    document.getElementById("studentEmail").addEventListener("input", displayMyEvents);

    displayEvents();
    displayMyEvents();
</script>

</body>
</html>
